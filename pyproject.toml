[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ehr-organ-toxicity"
version = "0.1.0"
description = "Deterministic, zero-PHI clinical organ-toxicity evaluators (FDA eDISH/Hy's Law, KDIGO AKI, CKD-EPI 2021, Fridericia QTcF/CTCAE v5.0, ASTCT CRS) and schema-only MIMIC-IV/eICU-CRD cohort templates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Göktuğ Özkan, MD", email = "drozkan2@gmail.com"}
]
keywords = [
    "clinical-ai",
    "pharmacovigilance",
    "dili",
    "hys-law",
    "kdigo-aki",
    "ctcae",
    "astct-crs",
    "mimic-iv",
    "eicu",
    "ai-safety",
    "rlvr"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
organ-tox = "organ_tox.__main__:main"

[project.urls]
Homepage = "https://github.com/goktugozkanmd/open-ehr-organ-toxicity"
Repository = "https://github.com/goktugozkanmd/open-ehr-organ-toxicity"

[tool.setuptools.packages.find]
include = ["organ_tox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
